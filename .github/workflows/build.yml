name: Professional Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Swap Memory to Prevent OOM Crash
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev \
            libsqlite3-dev libssl-dev libffi-dev liblzma-dev \
            build-essential ccache libstdc++6:i386 libgcc1:i386 zlib1g:i386 libncurses5:i386

      - name: Install Python Build Tools
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36 virtualenv
          pip install buildozer

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-assistant-apk
          path: bin/*.apk
